# Standalone harness (its own workspace): paired OLD-vs-NEW remeasurement for
# cloudbring/artcraft-algorithms#190 (craft-jpeg claim C10, Huffman lookahead 1.77x).
# OLD = storytold/craft-libs at 47c9f625 (merge-base of algo/151-30-huffman with origin/main); NEW = this checkout by path.
[package]
name = "perf-remeasure"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
craft-bench = { git = "https://github.com/cloudbring/craft-libs", rev = "94c6d76e5bc2c936d3db5ce5e19d70213e8390c0" }
serde_json = "1"
jpeg-encoder = "0.6"
old-jpeg = { package = "craft-jpeg", git = "https://github.com/storytold/craft-libs", rev = "47c9f62530db72bc5c3831c86653b47b20c640be" }
new-jpeg = { package = "craft-jpeg", path = "../../crates/jpeg" }

# default release profile, as in the craft-libs workspace (no [profile] section there)
[profile.release]
